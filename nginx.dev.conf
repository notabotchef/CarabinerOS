map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # A0 creates a new session cookie per runtime_id on each restart.
    # During dev, these accumulate and exceed nginx's default 8k header buffer.
    large_client_header_buffers 4 32k;

    # ── A0 chat endpoints (must go directly to A0, not through Next.js,
    #    so the Flask session matches the Socket.IO connection) ──
    location ~ ^/(csrf_token|message_async|message|chat_create|chat_load|chat_remove|chat_reset|chats|settings_get|settings_set)$ {
        proxy_pass http://agent-zero:80/api/$1;
        proxy_set_header Host localhost:8080;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Host localhost:8080;
        proxy_set_header X-Forwarded-Proto http;
    }

    # ── Detail routes: /api/<resource>/<uuid> → /api/<resource>?id=<uuid> ──
    location ~ "^/api/(orders|inventory|prep|food-cost|menu|recipes|invoices|campaigns|inventory/counts)/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$" {
        proxy_pass http://agent-zero:80/api/$1?id=$2;
        proxy_set_header Host localhost:8080;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Host localhost:8080;
        proxy_set_header X-Forwarded-Proto http;
    }

    # ── A0 API (includes CarabinerOS routes registered via blueprint) ──
    location /api/ {
        proxy_pass http://agent-zero:80/api/;
        proxy_set_header Host localhost:8080;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Host localhost:8080;
        proxy_set_header X-Forwarded-Proto http;
    }

    # ── Socket.IO ──
    location /socket.io/ {
        proxy_pass http://agent-zero:80/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host localhost:8080;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host localhost:8080;
        proxy_read_timeout 86400;
    }

    # ── A0 native WebUI (accessible at /a0/) ──
    location /a0/ {
        proxy_pass http://agent-zero:80/;
        proxy_set_header Host localhost:8080;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # ── Frontend (Next.js) — default ──
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host localhost:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
