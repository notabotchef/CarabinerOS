map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # CarabinerOS workspace API
    location /api/ {
        proxy_pass http://agent-zero:5000/api/;
        proxy_set_header Host localhost:8080;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-Host localhost:8080;
        proxy_set_header X-Forwarded-Proto http;
    }

    # Frontend (Next.js) — default
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host localhost:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host localhost:8080;

        # Next.js HMR websocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Shared proxy settings for Agent Zero backend
    # Cookie header must be explicitly forwarded so the Flask session cookie
    # (set by /csrf_token) is present on WebSocket upgrade and REST requests.

    # Agent Zero Socket.IO — MUST come before catch-all
    # Handles both polling (regular HTTP) and websocket (upgrade) transports.
    location /socket.io/ {
        proxy_pass http://agent-zero:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        # Only send "upgrade" when the client actually requests a WebSocket
        # upgrade; plain polling requests need a normal connection header.
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host localhost:8080;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host localhost:8080;
        proxy_read_timeout 86400;
    }

    # Agent Zero built-in UI
    # proxy_hide_header X-Frame-Options ensures the webui can be embedded
    # as an iframe inside the Next.js shell (/settings, /plugins bridge pages).
    location /a0/ {
        proxy_pass http://agent-zero:5000/;
        proxy_set_header Host localhost:8080;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Allow same-origin iframe embedding from frontend shell
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Agent Zero REST endpoints
    location = /csrf_token {
        proxy_pass http://agent-zero:5000/api/csrf_token;
        proxy_set_header Host localhost:8080;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin http://localhost:8080;
        proxy_set_header X-Forwarded-Host localhost:8080;
        proxy_set_header X-Forwarded-Proto http;
    }

    # Agent Zero chat/message endpoints — all under /api/ in A0 v1.11+
    location /message_async {
        proxy_pass http://agent-zero:5000/api/message_async;
        proxy_set_header Host localhost:8080;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Host localhost:8080;
        proxy_set_header X-Forwarded-Proto http;
    }

    location /message {
        proxy_pass http://agent-zero:5000/api/message;
        proxy_set_header Host localhost:8080;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Host localhost:8080;
        proxy_set_header X-Forwarded-Proto http;
    }

    location /chats {
        proxy_pass http://agent-zero:5000/api/chats;
        proxy_set_header Host localhost:8080;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Host localhost:8080;
        proxy_set_header X-Forwarded-Proto http;
    }

    location /chat_load {
        proxy_pass http://agent-zero:5000/api/chat_load;
        proxy_set_header Host localhost:8080;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Host localhost:8080;
        proxy_set_header X-Forwarded-Proto http;
    }

    location /chat_create {
        proxy_pass http://agent-zero:5000/api/chat_create;
        proxy_set_header Host localhost:8080;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Host localhost:8080;
        proxy_set_header X-Forwarded-Proto http;
    }

    location /chat_remove {
        proxy_pass http://agent-zero:5000/api/chat_remove;
        proxy_set_header Host localhost:8080;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Host localhost:8080;
        proxy_set_header X-Forwarded-Proto http;
    }
}
