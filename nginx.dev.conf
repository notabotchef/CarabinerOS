map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # CarabinerOS workspace API
    location /api/ {
        proxy_pass http://agent-zero:5000/api/;
        proxy_set_header Host localhost:8080;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-Host localhost:8080;
        proxy_set_header X-Forwarded-Proto http;
    }

    # Frontend (Next.js) — default
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host localhost:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host localhost:8080;

        # Next.js HMR websocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Shared proxy settings for Agent Zero backend
    # Cookie header must be explicitly forwarded so the Flask session cookie
    # (set by /csrf_token) is present on WebSocket upgrade and REST requests.

    # Agent Zero Socket.IO — MUST come before catch-all
    # Handles both polling (regular HTTP) and websocket (upgrade) transports.
    location /socket.io/ {
        proxy_pass http://agent-zero:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        # Only send "upgrade" when the client actually requests a WebSocket
        # upgrade; plain polling requests need a normal connection header.
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host localhost:8080;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host localhost:8080;
        proxy_read_timeout 86400;
    }

    # Agent Zero built-in UI
    location /a0/ {
        proxy_pass http://agent-zero:5000/;
        proxy_set_header Host localhost:8080;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Agent Zero REST endpoints
    location /csrf_token {
        proxy_pass http://agent-zero:5000/csrf_token;
        proxy_set_header Host localhost:8080;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Host localhost:8080;
        proxy_set_header X-Forwarded-Proto http;
    }

    location /message_async {
        proxy_pass http://agent-zero:5000/message_async;
        proxy_set_header Host localhost:8080;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-Host localhost:8080;
        proxy_set_header X-Forwarded-Proto http;
    }

    location /message {
        proxy_pass http://agent-zero:5000/message;
        proxy_set_header Host localhost:8080;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-Host localhost:8080;
        proxy_set_header X-Forwarded-Proto http;
    }

    location /chats {
        proxy_pass http://agent-zero:5000/chats;
        proxy_set_header Host localhost:8080;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-Host localhost:8080;
        proxy_set_header X-Forwarded-Proto http;
    }

    location /chat_load {
        proxy_pass http://agent-zero:5000/chat_load;
        proxy_set_header Host localhost:8080;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-Host localhost:8080;
        proxy_set_header X-Forwarded-Proto http;
    }

    location /chat_create {
        proxy_pass http://agent-zero:5000/chat_create;
        proxy_set_header Host localhost:8080;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-Host localhost:8080;
        proxy_set_header X-Forwarded-Proto http;
    }

    location /chat_remove {
        proxy_pass http://agent-zero:5000/chat_remove;
        proxy_set_header Host localhost:8080;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-Host localhost:8080;
        proxy_set_header X-Forwarded-Proto http;
    }
}
