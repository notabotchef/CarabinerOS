services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: carabiner
      POSTGRES_PASSWORD: carabiner
      POSTGRES_DB: carabiner
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carabiner"]
      interval: 5s
      timeout: 3s
      retries: 5

  agent-zero:
    build:
      context: .
      dockerfile: Dockerfile.agent-zero
    environment:
      - WEB_UI_PORT=5000
      - WEB_UI_HOST=0.0.0.0
      - DATABASE_URL=postgresql+asyncpg://carabiner:carabiner@postgres:5432/carabiner
    volumes:
      - ./usr:/app/usr
      - ./carabiner:/app/carabiner
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_A0_URL=
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/next.config.ts:/app/next.config.ts
    depends_on:
      agent-zero:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - agent-zero

volumes:
  pgdata:
