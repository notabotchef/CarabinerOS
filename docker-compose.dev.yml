services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: carabiner
      POSTGRES_PASSWORD: carabiner
      POSTGRES_DB: carabiner
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carabiner"]
      interval: 5s
      timeout: 3s
      retries: 5

  agent-zero:
    build:
      context: .
      dockerfile: Dockerfile.agent-zero
    environment:
      - DATABASE_URL=postgresql+asyncpg://carabiner:carabiner@postgres:5432/carabiner
      - FLASK_SECRET_KEY=carabiner-dev-secret-key-2026
      - ALLOWED_ORIGINS=*://localhost,*://localhost:*,*://127.0.0.1,*://127.0.0.1:*,*://0.0.0.0:*,*://10.0.0.39:*
    volumes:
      - ./usr:/a0/usr
      - ./carabiner:/cos/carabiner
    ports:
      - "5050:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - A0_URL=http://agent-zero:80
      - NEXT_PUBLIC_A0_URL=
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/next.config.ts:/app/next.config.ts
    depends_on:
      agent-zero:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - agent-zero

volumes:
  pgdata:
