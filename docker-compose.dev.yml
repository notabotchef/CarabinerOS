services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: carabiner
      POSTGRES_PASSWORD: carabiner
      POSTGRES_DB: carabiner
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carabiner"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
