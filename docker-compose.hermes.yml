name: carabiner-hermes

# Full stack: postgres + bridge + dedicated Hermes API gateway + frontend + nginx.
# Hermes is isolated (API server only; no Telegram). Credentials live in
# var/hermes-home/ (gitignored), seeded from the host ~/.hermes install.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-carabiner}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-carabiner}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  # Start bridge before hermes so MCP URL is reachable, but do not require
  # hermes for bridge process start (avoids circular depends_on).
  bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    env_file:
      - .env
    environment:
      CARABINER_RUNTIME: ${CARABINER_RUNTIME:-hermes}
      HERMES_BASE_URL: ${HERMES_BASE_URL:-http://hermes:8642}
      API_SERVER_KEY: ${API_SERVER_KEY:?API_SERVER_KEY is required}
      HERMES_MODEL: ${HERMES_MODEL:-carabineros-hermes}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-carabiner}
      BRIDGE_PORT: "8641"
    ports:
      - "8641:8641"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8641/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  hermes:
    build:
      context: .
      dockerfile: Dockerfile.hermes
    # Secrets + API_SERVER_* only — from dedicated home (no Telegram tokens)
    env_file:
      - ./var/hermes-home/.env
    environment:
      HERMES_HOME: /opt/data
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      # Do not re-declare OPENROUTER here — empty compose defaults would
      # wipe the env_file values.
    volumes:
      - ./var/hermes-home:/opt/data
    ports:
      - "8642:8642"
    depends_on:
      bridge:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -H \"Authorization: Bearer $$API_SERVER_KEY\" http://127.0.0.1:8642/v1/models >/dev/null",
        ]
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 90s

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://bridge:8641
      A0_URL: http://bridge:8641
    depends_on:
      bridge:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.hermes.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8090:80"
    depends_on:
      - bridge
      - frontend

volumes:
  pgdata:
