services:
  engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile.engine
    image: carabineros:latest
    container_name: carabineros-engine
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://carabiner:carabiner@db:5432/carabiner
      CHAT_MODEL_PROVIDER: ollama
      CHAT_MODEL_NAME: qwen3.5:9b
      CHAT_MODEL_API_BASE: http://host.docker.internal:11434
      UTILITY_MODEL_PROVIDER: ollama
      UTILITY_MODEL_NAME: qwen3.5:9b
      UTILITY_MODEL_API_BASE: http://host.docker.internal:11434
      EMBEDDINGS_MODEL_PROVIDER: huggingface
      EMBEDDINGS_MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2
      BROWSER_MODEL_PROVIDER: ollama
      BROWSER_MODEL_NAME: qwen3.5:9b
      BROWSER_MODEL_API_BASE: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - engine_data:/app/engine/agent-zero/usr
      - ../engine/bridge.py:/app/engine/bridge.py
      - ../engine/main.py:/app/engine/main.py
      - ../engine/carabiner:/app/engine/carabiner
      - ../engine/tests:/app/engine/tests
      - ../engine/pyproject.toml:/app/engine/pyproject.toml
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/api/health'); r.raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:16-alpine
    container_name: carabineros-db
    environment:
      POSTGRES_USER: carabiner
      POSTGRES_PASSWORD: carabiner
      POSTGRES_DB: carabiner
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carabiner"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: carabineros-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_ENGINE_URL: http://engine:8000
    depends_on:
      engine:
        condition: service_healthy

volumes:
  postgres_data:
  engine_data:
